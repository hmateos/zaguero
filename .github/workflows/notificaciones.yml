name: Notificaciones Zaguero
on:
  schedule:
    - cron: '30 5,6 * * *'   # 7:30 en Madrid (verano e invierno)
    - cron: '0 19,20 * * *'  # 21:00 en Madrid (verano e invierno)
  workflow_dispatch:
    inputs:
      tipo:
        description: 'morning, evening o test'
        required: true
        default: 'test'
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save web-push@3.6.7
      - run: node tools/push.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PUSH_TYPE: ${{ github.event.inputs.tipo }}
