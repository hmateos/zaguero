<title>Zaguero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap">
<style>
/* Layout: app móvil oscura y sobria. Columna de 440px, imagen protagonista en inicio,
   lista de bloques con miniaturas, modo entrenamiento a pantalla completa con números grandes.
   Tema único oscuro, elegido a propósito. */
:root{
  --bg:#0A0A0B;
  --warm:#3A1712;
  --warm2:#6B3322;
  --s1:#141415;
  --s2:#1C1C1F;
  --s3:#27272B;
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.14);
  --fg:#F4F4F1;
  --mute:#8E8E94;
  --dim:#5E5E64;
  --acc:#E4EE6E;
  --acc-ink:#15160A;
  --white:#FFFFFF;
  --paper:#EDEDEA;
  --mu:#232327;
  --mu-line:#4B4B52;
  --mu-skin:#18181B;
  --black:#000000;
  --warn:#F2B451;
  --bad:#F0675C;
  --f-ui:'Geist',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  --f-num:'Geist',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  --f-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-disp:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(120% 55% at 50% 112%,var(--warm) 0%,rgba(58,23,18,0) 62%) fixed,var(--bg);color:var(--fg);font:400 15px/1.45 var(--f-ui);padding-inline:16px;-webkit-font-smoothing:antialiased;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.app{max-width:440px;margin:0 auto;padding-block:14px 170px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.t-xs{font-size:12px}
.title{font:500 28px/1.12 var(--f-ui);letter-spacing:-.025em;margin:0}
.h2{font:500 17px/1.2 var(--f-ui);letter-spacing:-.01em;margin:0}
.meta{font-size:12.5px;color:var(--mute);line-height:1.5}
.meta i{font-style:normal;color:var(--dim);padding-inline:5px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 18px}
.wordmark{font:600 13px/1 var(--f-ui);letter-spacing:.32em;text-transform:uppercase}
.wordmark b{color:var(--acc);font-weight:600}
.wordmark{display:inline-flex;align-items:center;gap:10px}
.zmark{width:26px;height:auto;flex:none;color:var(--fg)}
.hero .zbig{position:absolute;right:-18px;bottom:120px;width:62%;max-width:300px;color:rgba(255,255,255,.035);z-index:-1;pointer-events:none}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line)}
.iconbtn.light{background:var(--white);color:var(--black);border-color:var(--white)}
.iconbtn svg{width:19px;height:19px}

/* inicio */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:430px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;background:
  radial-gradient(70% 55% at 78% 8%,rgba(255,214,170,.20) 0%,rgba(255,214,170,0) 70%),
  radial-gradient(90% 70% at 20% 30%,var(--warm2) 0%,rgba(107,51,34,0) 70%),
  linear-gradient(180deg,#24120E 0%,#120B0A 55%,#0B0A0A 100%);isolation:isolate}
.hero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,10,11,0) 30%,rgba(10,10,11,.85) 100%)}
.hero .beam{position:absolute;top:-10%;right:14%;width:38%;height:120%;z-index:-1;background:linear-gradient(180deg,rgba(255,236,210,.10),rgba(255,236,210,0) 70%);transform:skewX(-14deg);filter:blur(6px)}
.hero .lockup{position:absolute;top:22px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center}
.hero .lockup .mono{font-size:11px;color:rgba(255,255,255,.62)}
.slogan{font:800 italic 46px/.92 var(--f-disp);letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
.hero p{margin:0 0 20px;color:rgba(255,255,255,.72);font-size:14px;max-width:32ch}
.pill{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:999px;font:500 15px/1 var(--f-ui);width:100%}
.pill.white{background:var(--white);color:var(--black)}
.pill.dark{background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--fg)}
.pill svg{width:18px;height:18px}
.pills{display:grid;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:22px}
.wd{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;border-radius:14px}
.wd span{font:500 11px/1 var(--f-mono);color:var(--dim)}
.wd i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:500 11px/1 var(--f-mono);font-style:normal;color:var(--mute);border:1px solid var(--line)}
.wd.gym i{border-color:var(--line2);color:var(--fg)}
.wd.match i{border-color:rgba(242,180,81,.5);color:var(--warn)}
.wd.done i{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.wd.today{background:var(--s1)}
.wd.today span{color:var(--fg)}
.list{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:4px 16px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:0}
.row .nm{font:500 14.5px/1.3 var(--f-ui);letter-spacing:-.005em}
.row .sb{font-size:12.5px;color:var(--mute);margin-top:3px}
.row .end{color:var(--dim);display:flex;align-items:center;gap:8px}
.row .end svg{width:18px;height:18px}
.dot-ok{width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.dot-ok svg{width:12px!important;height:12px!important}
.thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.55);background:
  radial-gradient(80% 80% at 25% 15%,rgba(255,255,255,.12),rgba(255,255,255,0) 60%),linear-gradient(160deg,var(--s3),#141416)}
.thumb.wB{background:radial-gradient(80% 80% at 25% 15%,rgba(255,200,160,.16),rgba(255,255,255,0) 60%),linear-gradient(160deg,#2E201B,#151213)}
.thumb.wE{background:radial-gradient(80% 80% at 25% 15%,rgba(228,238,110,.14),rgba(255,255,255,0) 60%),linear-gradient(160deg,#25261C,#141413)}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb svg{width:24px;height:24px}

/* sesión */
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:22px}
.seg3 button{height:36px;border-radius:999px;font:500 12.5px/1 var(--f-ui);color:var(--mute);text-align:center;white-space:nowrap}
.seg3 button[aria-pressed="true"]{background:var(--s3);color:var(--fg)}
.shead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding-inline:11px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font:500 11.5px/1 var(--f-ui);color:var(--mute);white-space:nowrap}
.chip .lt{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.lt.g{background:var(--acc)}.lt.a{background:var(--warn)}.lt.r{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:18px 18px 8px;margin-top:22px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:6px}
.sheet-top .lbl{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12.5px}
.sheet-top .lbl svg{width:15px;height:15px}
.blk{padding-top:18px}
.blk-h{padding-bottom:10px;border-bottom:1px solid var(--line)}
.blk-h .h2{font-size:15px}
.blk-h .meta{margin-top:2px}
.blk .row{border-bottom:1px solid var(--line)}
.blk:last-child .row:last-child{border-bottom:0}
.pairmark{font:500 10.5px/1 var(--f-mono);color:var(--acc);letter-spacing:.02em}
.dock{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));padding-inline:16px;z-index:6;pointer-events:none}
.dock .pill{max-width:408px;margin:0 auto;pointer-events:auto;box-shadow:0 18px 40px -14px rgba(0,0,0,.8)}

/* hojas modales */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-inline:0}
.modal{width:100%;max-width:472px;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 16px}
.q{margin-top:16px}
.q .meta{margin-bottom:8px}
.opt3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--s2);border-radius:14px;padding:4px}
.opt3 button{height:42px;border-radius:10px;font:500 13px/1 var(--f-ui);color:var(--mute);text-align:center}
.opt3 button[aria-pressed="true"]{background:var(--fg);color:var(--black)}
.verdict{margin-top:20px;padding:14px 16px;border-radius:16px;background:var(--s2);display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;align-items:start}
.verdict .lt{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--dim)}
.verdict b{font-weight:500}
.verdict p{margin:2px 0 0;color:var(--mute);font-size:13.5px}

/* detalle de ejercicio */
.back{display:inline-flex;align-items:center;gap:6px;height:40px;color:var(--mute);margin:-6px 0 10px -6px;padding-inline:6px}
.back svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0 30px}
.stat .meta{font-size:11.5px}
.big{font:400 28px/1.05 var(--f-num);letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:13px;color:var(--mute);letter-spacing:0;margin-left:3px}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px;margin:12px 0 22px}
.toggle button{height:34px;border-radius:999px;font:500 12px/1 var(--f-ui);color:var(--mute);text-align:center}
.toggle button[aria-pressed="true"]{background:var(--s3);color:var(--fg)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--dim);font:500 10px var(--f-mono)}
.chart .pt{fill:var(--acc)}
.chart .vl{stroke:var(--acc);stroke-width:1;opacity:.6}
.chart .lbl{fill:var(--acc);font:500 11px var(--f-mono)}
.ranges{display:flex;gap:6px;margin-top:12px}
.ranges button{height:28px;padding-inline:12px;border-radius:999px;font:500 11.5px/1 var(--f-mono);color:var(--mute)}
.ranges button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.insight{margin-top:20px;padding:14px 16px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:13.5px;color:var(--mute)}
.insight b{color:var(--acc);font-weight:500}
.emptychart{height:180px;border-radius:16px;border:1px dashed var(--line2);display:grid;place-items:center;text-align:center;color:var(--mute);font-size:13.5px;padding:20px}
.how{margin-top:26px;font-size:14.5px;color:var(--fg);line-height:1.55}
.vars{margin-top:8px}
.var{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);width:100%}
.var:last-child{border-bottom:0}
.var .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2)}
.var[aria-pressed="true"] .rd{border:6px solid var(--acc)}

/* reproductor de entrenamiento */
.player{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 50% at 50% 115%,var(--warm) 0%,rgba(58,23,18,0) 60%),var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.pl{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.pl-top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px}
.pl-time{font:400 22px/1 var(--f-num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pl-top .acts{display:flex;gap:6px}
.pl-top .acts button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--fg)}
.pl-top .acts svg{width:20px;height:20px}
.prog{display:flex;gap:4px;margin:12px 0 16px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--s3);position:relative;overflow:visible}
.prog i b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:rgba(228,238,110,.55)}
.prog i.cur b{background:var(--acc)}
.prog i.cur b::after{content:"";position:absolute;right:-4px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(228,238,110,.18)}
.stage{position:relative;flex:1;min-height:520px;border-radius:24px;overflow:hidden;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;isolation:isolate}
.stage .media{position:absolute;inset:0;z-index:-2;background:
  radial-gradient(55% 45% at 72% 18%,rgba(255,226,190,.16),rgba(255,226,190,0) 70%),
  radial-gradient(80% 60% at 25% 60%,rgba(107,51,34,.55),rgba(107,51,34,0) 70%),
  linear-gradient(180deg,#1B1513,#0F0D0D)}
.stage .media img,.stage .media video{width:100%;height:100%;object-fit:cover}
.stage .media .glyph{position:absolute;right:-30px;bottom:90px;width:250px;height:250px;color:rgba(255,255,255,.05)}
.stage::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,8,9,.55) 0%,rgba(8,8,9,0) 30%,rgba(8,8,9,0) 52%,rgba(8,8,9,.9) 100%)}
.st-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:18px 18px 0}
.st-head .set{font:500 12px/1 var(--f-mono);color:var(--acc);margin-bottom:9px}
.st-head h2{font:500 25px/1.12 var(--f-ui);letter-spacing:-.02em;margin:0;text-wrap:balance}
.st-head .blkl{font-size:12.5px;color:rgba(255,255,255,.62);margin-top:8px}
.more{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center}
.more svg{width:18px;height:18px}
.fieldlbl{display:block;font:500 10.5px/1.4 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.ftxt{display:block;color:var(--fg);margin-bottom:10px}
.fieldbox{margin-top:22px;padding:14px 16px;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-size:14px}
.cue{margin:auto 18px 0;padding-top:16px;font-size:13.5px;color:rgba(255,255,255,.72);max-width:42ch}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px 18px;align-items:end}
.num{min-width:0}
.num.r{text-align:right}
.num input{width:100%;background:none;border:0;color:var(--fg);font:300 64px/1 var(--f-num);letter-spacing:-.04em;padding:0;font-variant-numeric:tabular-nums}
.num.r input{text-align:right}
.num .u{font-size:13px;color:rgba(255,255,255,.72);margin-top:4px}
.step{display:flex;gap:6px;margin-top:10px}
.num.r .step{justify-content:flex-end}
.step button{width:40px;height:34px;border-radius:999px;background:rgba(255,255,255,.1);font:500 16px/1 var(--f-ui);display:grid;place-items:center}
.done-btn{margin:14px 0 0}
.next{margin-top:12px;padding:16px 18px;border-radius:18px;background:var(--s1);border:1px solid var(--line);font-size:13.5px;color:var(--mute);display:flex;gap:8px;align-items:center;min-width:0}
.next b{color:var(--acc);font-weight:500;flex:none}
.next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.restc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px 18px;text-align:center}
.ring{position:relative;width:230px;height:230px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:rgba(255,255,255,.08);stroke-width:4}
.ring .pr{fill:none;stroke:var(--acc);stroke-width:4;stroke-linecap:round}
.ring .tv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tv b{font:300 64px/1 var(--f-num);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring .tv span{font-size:12.5px;color:var(--mute);margin-top:6px}
.restc .row2{display:flex;gap:8px}
.restc .row2 button{height:42px;padding-inline:18px;border-radius:999px;background:rgba(255,255,255,.1);font:500 13.5px/1 var(--f-ui)}
.warmlist{padding:8px 18px 0;margin-top:auto}
.wi{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;width:100%}
.wi:last-child{border-bottom:0}
.wi .bx{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);display:grid;place-items:center;color:transparent}
.wi .bx svg{width:12px;height:12px}
.wi[aria-pressed="true"] .bx{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.wi[aria-pressed="true"] span:last-child{color:var(--mute)}
.summary{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 18px 18px}
.summary .slogan{font-size:52px}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 22px}

/* progreso y plan */
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px}
.kp>div{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px}
.bars{display:flex;gap:4px;margin-top:10px}
.bars i{flex:1;height:3px;border-radius:2px;background:var(--s3)}
.bars i.on{background:var(--acc)}
.empty{padding:26px 18px;border-radius:20px;border:1px dashed var(--line2);color:var(--mute);text-align:center;font-size:14px}
.phases{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:4px 18px}
.phr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.phr:last-child{border-bottom:0}
.phr .ix{font:500 11px/1 var(--f-mono);color:var(--dim)}
.phr .nm{font-weight:500}
.phr .v{font:500 12px/1.3 var(--f-mono);color:var(--mute);text-align:right}
.phr.on .ix,.phr.on .nm{color:var(--acc)}
.wkstep{display:flex;align-items:center;gap:10px;margin-top:12px}
.wkstep button{width:40px;height:40px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.wkstep p{flex:1;margin:0;font-size:13px;color:var(--mute);text-align:center}
.struct .row{grid-template-columns:40px minmax(0,1fr)}
.struct .k{font:800 italic 30px/1 var(--f-disp);color:var(--acc)}
.refs{list-style:none;margin:0;padding:0}
.refs li{padding:14px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--mute)}
.refs li:last-child{border-bottom:0}

/* ---------- utilidades ---------- */
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseISO(s){var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function dow(d){return (d.getDay()+6)%7}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function mondayOf(d){return addDays(d,-dow(d))}
function baseWeeks(){return Math.max(0,Math.round((mondayOf(today())-mondayOf(parseISO(S.start)))/(7*864e5)))}
function ctx(){var ws=Math.max(0,baseWeeks()+(S.offset||0));return{ws:ws,pi:ws%4,vi:ws%3,block:Math.floor(ws/4)+1,phase:PHASES[ws%4]}}
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function curMon(){return mondayOf(today())}
function keyOf(g){return iso(curMon())+'|'+g.id}
function clonePlan(p){return JSON.parse(JSON.stringify(p))}
function assignGym(sel){var g={};if(sel.indexOf(0)>-1)g.md1=0;if(sel.indexOf(1)>-1)g.md5=1;if(sel.indexOf(2)>-1)g.md4=2;if(sel.indexOf(3)>-1)g.md3=3;return g}
function planFor(mon){return S.weeks[iso(mon)]||S.plan}
function dayOf(id,mon){return planFor(mon||curMon()).gym[id]}
var DAYF=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
function on(v){return v!==null&&v!==undefined}
function mdLabel(day,match){
  if(!on(day)||match===null||match===undefined)return '';
  if(day===match)return 'MD';
  var after=(day-match+7)%7,before=(match-day+7)%7;
  return after<=2?'MD+'+after:'MD-'+before;
}
function mdOf(id,mon){var p=planFor(mon||curMon());return mdLabel(p.gym[id],p.match)}
function weekModel(mon){
  var p=planFor(mon),out=[];
  for(var i=0;i<7;i++){
    var g=null;for(var id in p.gym){if(p.gym[id]===i)g=id}
    var field=p.field.indexOf(i)>-1,md=mdLabel(i,p.match);
    if(g)out.push({t:'gym',g:g,md:md,field:field});
    else if(p.match===i)out.push({t:'match',md:md,n:'Partido'});
    else if(field)out.push({t:'field',md:md,n:'Entreno con el equipo'});
    else out.push({t:'off',md:md,n:'Descanso'});
  }
  return out;
}
function whenOf(id){
  var p=planFor(curMon()),d=p.gym[id],md=mdLabel(d,p.match);
  if(!on(d))return 'Fuera esta semana';
  return DAYF[d].charAt(0).toUpperCase()+DAYF[d].slice(1)+(md?' · '+md:'')+(p.field.indexOf(d)>-1?' · gimnasio antes del entreno de 19:30':'');
}
function gymOrder(mon,all){var p=planFor(mon||curMon());var a=['md1','md5','md4','md3'].filter(function(id){return on(p.gym[id])}).sort(function(x,y){return p.gym[x]-p.gym[y]});if(all)['md1','md5','md4','md3'].forEach(function(id){if(a.indexOf(id)<0)a.push(id)});return a}
function planWarnings(p){
  var w=[],days=[p.gym.md1,p.gym.md5,p.gym.md4,p.gym.md3].filter(on);
  if(new Set(days).size<days.length)w.push(['r','Dos sesiones el mismo día','Cada sesión necesita su día. Mueve una de ellas.']);
  var leg=p.gym.md4;
  if(!days.length)w.push(['a','Semana sin gimnasio','Si es por carga de partidos o descanso, está bien. Intenta que no sean dos semanas seguidas.']);
  else if(!on(leg))w.push(['a','Sin día de pierna esta semana','Si encuentras un hueco, haz una versión corta de 30 minutos: saltos, sentadilla y nórdico.']);
  if(days.length===2)w.push(['a','Semana de 2 sesiones','Con 2 sesiones de fuerza a la semana sigues mejorando. Prioriza que una sea la de pierna.']);
  if(on(leg)&&p.match!==null&&p.match!==undefined){

    if(before>=1&&before<=2)w.push(['r','Pierna a '+(before*24)+' h del partido','Llegarías con las piernas cargadas. Muévela a 3 o 4 días antes del partido o haz solo Explotar y Blindar ese día.']);

    if(leg===p.match)w.push(['r','Pierna el día del partido','No la hagas el mismo día del partido.']);

/* ---------- historial ---------- */
function history(name){
  var pts={};
  Object.keys(S.logs).forEach(function(k){
    var date=S.logs[k].d||k.split('|')[0],m=S.logs[k].ex||{};
    for(var i in m){var e=m[i];if(!e||e.n!==name||!e.sets)continue;
      e.sets.forEach(function(x){if(!x||!x.ok)return;
        var p=pts[date]||(pts[date]={date:date,rm:0,vol:0,kg:0,reps:0});
        var rm=x.kg>0?x.kg*(1+Math.min(x.reps,12)/30):0;
        if(rm>p.rm){p.rm=rm}
        if(x.kg>p.kg||(x.kg===p.kg&&x.reps>p.reps)){p.kg=x.kg;p.reps=x.reps}
        p.vol+=(x.kg||0)*(x.reps||0);
      });
    }
  });
  return Object.keys(pts).sort().map(function(d){return pts[d]});
}

  var span=(max-min)||Math.abs(max)*.1||1,lo=Math.max(0,min-span*.4),hi=max+span*.25,dec=(hi-lo)<0.6?2:(hi-lo)<15?1:0;
  var t0=parseISO(pts[0].date).getTime(),t1=parseISO(pts[pts.length-1].date).getTime();if(t1===t0)t1=t0+864e5;
  function X(p){return pl+(parseISO(p.date).getTime()-t0)/(t1-t0)*(W-pl-pr)}
  function Y(v){return pt+(1-(v-lo)/(hi-lo))*(H-pt-pb)}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p).toFixed(1)+' '+Y(p[key]).toFixed(1)}).join(' ');
  var last=pts[pts.length-1],lx=X(last),ly=Y(last[key]),ld=parseISO(last.date);
  var mid=(lo+hi)/2;
  var ticks=[hi,mid,lo].map(function(v){return '<line class="gl" x1="'+pl+'" x2="'+(W-pr+6)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(W-pr+10)+'" y="'+(Y(v)+3)+'">'+(key==='vol'&&v>=1000?Math.round(v/100)/10+'k':v.toFixed(dec).replace('.',','))+'</text>'}).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Historial">'+
    '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".28"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>'+ticks+
    '<path d="'+d+' L'+lx.toFixed(1)+' '+Y(lo)+' L'+X(pts[0]).toFixed(1)+' '+Y(lo)+' Z" fill="url(#ga)"/>'+
    '<path class="ln" d="'+d+'"/>'+
    '<line class="vl" x1="'+lx+'" x2="'+lx+'" y1="'+(ly+6)+'" y2="'+Y(lo)+'"/>'+
    '<circle class="pt" cx="'+lx+'" cy="'+ly+'" r="4.5"/>'+
    '<text class="lbl" x="'+Math.min(lx,W-pr-4)+'" y="'+(ly-12)+'" text-anchor="end">'+ld.getDate()+' '+MONTHS[ld.getMonth()]+'</text></svg>';
}

  if(last===iso(d))d=addDays(d,28);
  return iso(d)===iso(t)?'hoy':DAYF[dow(d)]+' '+d.getDate()+' de '+['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()];

function growth(pts,inv){if(!pts||pts.length<2)return null;var a=pts[0].v,b=pts[pts.length-1].v;if(!a)return null;var g=(b-a)/a*100;return inv?-g:g}

  var M=MUS[id],seen={},list=[];
  M.s.forEach(function(x){slotNames(x[0],x[1]).forEach(function(n){if(seen[n])return;seen[n]=1;var s=exSeries(n);if(s.length)list.push({n:n,pts:s,g:growth(s)})})});
  var gs=list.filter(function(x){return x.g!==null});
  return{list:list,g:gs.length?gs.reduce(function(a,x){return a+x.g},0)/gs.length:null};
}

  var pw=series(S.meas,'peso');if(!pw.length)return [];
  return exSeries('Sentadilla trasera').filter(function(p){return p.kg>0}).map(function(p){
    var w=pw[0].v;pw.forEach(function(x){if(x.date<=p.date)w=x.v});return{date:p.date,v:Math.round(p.v/w*100)/100};
  });
}
function weekSessions(){
  var mon=iso(mondayOf(today())),sun=iso(addDays(mondayOf(today()),6)),tot=0,wk=0;

    for(var i in m){if(m[i]&&m[i].sets&&m[i].sets.some(function(x){return x&&x.ok}))has=true}
    if(l.done||has){tot++;if(d>=mon&&d<=sun)wk++}});
  return{total:tot,week:wk};
}

function stair(c){
  var W=340,H=150,pb=22,pt=10,n=12,bw=(W-8)/n;
  var pc=[.775,.825,.865,.675],vals=[];
  for(var i=0;i<n;i++){var blk=Math.floor(i/4);vals.push(100*(1+.03*blk)*pc[i%4])}
  var lo=55,hi=100;function Y(v){return pt+(1-(v-lo)/(hi-lo))*(H-pt-pb)}
  var bars=vals.map(function(v,i){var x=4+i*bw+3,y=Y(v);var on=Math.floor(i/4)===0&&i%4===c.pi;
    return '<rect class="bar'+(on?' on':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-6).toFixed(1)+'" height="'+(H-pb-y).toFixed(1)+'" rx="3"/>'+
      (i%4===2?'<text class="ax" x="'+(x+(bw-6)/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle">'+fmtKg(Math.round(v/2.5)*2.5)+'</text>':'');
  }).join('');
  var labels=[0,1,2].map(function(b){return '<text class="ax" x="'+(4+b*4*bw+2*bw).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">Bloque '+(b+1)+'</text>'}).join('');
  var tl='<path class="tl" d="M'+(4+bw/2)+' '+Y(vals[0])+' L'+(4+8*bw+bw/2)+' '+Y(vals[8])+'"/>';
  return '<svg class="stair" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Peso de la fuerza principal en tres bloques: sube dentro de cada bloque, baja en la descarga y cada bloque empieza más alto">'+bars+tl+labels+'</svg>';
}

/* ---------- reproductor ---------- */
function buildQueue(g,c){
  var q=[];
  BORDER.forEach(function(b){
    if(b==='A')return;
    for(var i=0;i<g.slots.length;i++){
      var sl=g.slots[i];if(sl.b!==b)continue;
      var nx=g.slots[i+1];
      if(sl.main&&nx&&nx.pair){
        var n1=nSets(sl,c.pi),n2=nSets(nx,c.pi);
        for(var s=0;s<Math.max(n1,n2);s++){if(s<n1)q.push({i:i,s:s});if(s<n2)q.push({i:i+1,s:s})}
        i++;
      }else{for(var s2=0;s2<nSets(sl,c.pi);s2++)q.push({i:i,s:s2})}
    }
  });
  return q;
}

  var pos=q.findIndex(function(st){return !isOk(k,st)});
  var warmDone=l.warm.filter(Boolean).length>=g.warm.length;
  P={g:g,k:k,q:q,pos:pos<0?q.length:pos,phase:pos<0?'done':(!warmDone&&pos===0?'warm':'set'),restEnd:0,restDur:0,vals:null};
  loadVals();renderPlayer();startTicker();
}

  if(a==='wk0'){S.offset=0;save();render(false);toast('Semana real del bloque');return}
  if(a==='bkcopy'){var ta=document.getElementById('bk');ta.value=JSON.stringify(S);ta.select();
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){toast('Copia lista')},function(){toast('Texto seleccionado: cópialo a mano')})}else toast('Texto seleccionado: cópialo a mano');return}
  if(a==='notion'){notiEnable();return}
  if(a==='notitest'){notiTest();return}
  if(a==='noticopy'){var ta2=document.getElementById('subtxt');ta2.select();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(NOTI.sub).then(function(){toast('Código copiado')},function(){toast('Texto seleccionado: cópialo a mano')})}else toast('Texto seleccionado: cópialo a mano');return}
  if(a==='wipe'){WIPE=!WIPE;render(false);return}
  if(a==='wipeok'){S={start:S.start,offset:0,logs:{},plan:{gym:{md1:0,md5:1,md4:2,md3:3},field:[1,3,4],match:6},weeks:{},rm:{},tests:[],meas:[],perf:[]};save();WIPE=false;render(false);toast('Datos borrados. Empiezas de cero');return}
  if(a==='bkrestore'){try{var o=JSON.parse(document.getElementById('bk').value);if(!o||typeof o!=='object'||!o.logs)throw 0;
    S={start:o.start||S.start,offset:o.offset||0,logs:o.logs};save();render(false);toast('Datos restaurados')}catch(err){toast('El texto no es una copia válida')}return}
  if(!P)return;
  if(a==='plclose'||a==='pllist'){closePlayer();if(a==='pllist'){view='sesion';render(true)}return}
  if(a==='pldetail'){var st0=P.q[P.pos];closePlayer();detail={i:st0.i};prevView='sesion';view='detalle';render(true);return}
  if(a==='warm'){var lw=ensureLog(P.k),i=Number(b.getAttribute('data-i'));lw.warm[i]=!lw.warm[i];fill(lw.warm);save();b.setAttribute('aria-pressed',String(!!lw.warm[i]));return}
  if(a==='warmgo'){P.phase='set';loadVals();renderPlayer();return}
  if(a==='adj'){readVals();var f=b.getAttribute('data-f'),d=Number(b.getAttribute('data-d'));P.vals[f]=Math.max(0,Math.round((P.vals[f]+d)*10)/10);
    var inp=document.getElementById(f==='kg'?'pl-kg':'pl-reps');inp.value=f==='kg'?fmtKg(P.vals.kg):P.vals.reps;return}
  if(a==='setdone'){setDone();return}
  if(a==='rest+'){P.restEnd+=15000;P.restDur+=15;return}
  if(a==='restskip'){P.phase='set';renderPlayer();return}
  if(a==='plfinish'){var lf=ensureLog(P.k);lf.done=true;save();closePlayer();toast('Sesión guardada');return}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='start'){if(t.value){S.start=t.value;S.offset=0;save();render(false)}return}
  if(t.id==='rmin'){var v=parseFloat(String(t.value).replace(',','.'))||0;S.rm=S.rm||{};if(v>0)S.rm[t.getAttribute('data-n')]=v;else delete S.rm[t.getAttribute('data-n')];save();render(false);return}
  if(t.id==='mediain'&&t.files&&t.files[0]){
    var f=t.files[0],nm=t.getAttribute('data-n');
    if(!/^(video|image)\//.test(f.type)){toast('Elige un vídeo o una foto');return}
    if(f.size>300*1024*1024){toast('El archivo pesa demasiado (máximo 300 MB)');return}
    mediaPut(nm,f).then(function(){if(VID[nm]){try{URL.revokeObjectURL(VID[nm].url)}catch(e){}}VID[nm]={url:URL.createObjectURL(f),video:/^video/.test(f.type)};render(false);toast('Guardado en este dispositivo')},function(){toast('No se pudo guardar el archivo en este navegador')});
  }
});

render(false);
mediaLoad();
mirror();
notiInit();
})();
</script>
